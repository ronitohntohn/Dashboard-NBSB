<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Cosern · Produtividade + Monitorias</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    /* (CSS IDÊNTICO AO ANTERIOR, SEM ALTERAÇÕES) */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --primary: #0057a0;
      --primary-light: #1a7bc4;
      --primary-dark: #003d73;
      --secondary: #00a651;
      --bg: #f0f4f9;
      --card-bg: rgba(255,255,255,0.75);
      --glass-border: rgba(255,255,255,0.25);
      --text: #1a2c3e;
      --text-muted: #5a6874;
      --shadow: 0 12px 32px rgba(0,0,0,0.06);
      --radius: 24px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    body.dark {
      --bg: #0e121c;
      --card-bg: rgba(20,26,40,0.85);
      --glass-border: rgba(255,255,255,0.08);
      --text: #edf2f8;
      --text-muted: #9ea7bb;
      --shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      transition:background 0.3s, color 0.2s;
      line-height:1.5;
      min-height:100vh;
      padding:16px;
    }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--primary-light); border-radius:10px; }

    .login-container {
      max-width:400px;
      width:92%;
      margin:60px auto;
      background:var(--card-bg);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-radius:var(--radius);
      padding:40px 28px;
      box-shadow:var(--shadow);
      text-align:center;
      border:1px solid var(--glass-border);
    }
    .login-container h2 {
      font-weight:700;
      margin-bottom:8px;
      font-size:32px;
      letter-spacing:-0.5px;
      background:linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .login-container .sub {
      color:var(--text-muted);
      font-size:14px;
      margin-bottom:28px;
    }
    .login-container input {
      width:100%;
      padding:14px 18px;
      border-radius:16px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,0.5);
      backdrop-filter:blur(4px);
      font-size:14px;
      margin-top:8px;
      transition:border 0.2s, box-shadow 0.2s;
      color:var(--text);
    }
    body.dark .login-container input {
      background:rgba(255,255,255,0.08);
    }
    .login-container input:focus {
      outline:none;
      border-color:var(--primary-light);
      box-shadow:0 0 0 4px rgba(0,87,160,0.15);
    }
    .login-container .btn {
      width:100%;
      margin-top:24px;
      background:var(--primary);
      border:none;
      padding:14px;
      border-radius:40px;
      color:white;
      font-weight:600;
      font-size:16px;
      cursor:pointer;
      transition:background 0.2s, transform 0.1s;
      text-align:center;
      display:block;
    }
    .login-container .btn:hover { background:var(--primary-dark); }
    .login-container .btn:active { transform:scale(0.97); }
    .error-msg { color:#d32f2f; margin-top:16px; font-size:14px; display:none; }

    #dashboard { display:none; max-width:1400px; margin:0 auto; }
    .app-wrapper { display:flex; gap:20px; }
    .dashboard-container { flex:1; min-width:0; }

    .sidebar-panel {
      width:0; overflow:hidden; transition:width 0.35s ease;
      background:var(--card-bg);
      backdrop-filter:blur(12px);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      border:1px solid var(--glass-border);
      position:sticky; top:20px;
      height:calc(100vh - 40px);
      display:flex; flex-direction:column;
      flex-shrink:0;
    }
    .sidebar-panel.open { width:340px; }
    .sidebar-content { padding:20px; overflow-y:auto; flex:1; }
    .sidebar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--glass-border); }
    .close-sidebar { background:transparent; border:none; font-size:24px; cursor:pointer; color:var(--text-muted); }
    .sidebar-content h4 { font-weight:600; margin:16px 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); }

    .card {
      background:var(--card-bg);
      backdrop-filter:blur(12px);
      border-radius:var(--radius);
      padding:20px 24px;
      margin-bottom:20px;
      box-shadow:var(--shadow);
      border:1px solid var(--glass-border);
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { box-shadow:0 16px 40px rgba(0,0,0,0.08); }

    .metric-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
      gap:16px;
      margin-bottom:20px;
    }
    .metric-card {
      background:var(--card-bg);
      backdrop-filter:blur(8px);
      border-radius:20px;
      padding:16px 14px;
      border:1px solid var(--glass-border);
      box-shadow:var(--shadow);
      text-align:center;
      position:relative;
      cursor:pointer;
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .metric-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,0.08); }
    .metric-card .expand-icon {
      position:absolute;
      top:6px;
      right:10px;
      font-size:14px;
      color:var(--text-muted);
      opacity:0.5;
    }
    .metric-card:hover .expand-icon { opacity:1; }
    .metric-label { font-size:12px; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; letter-spacing:0.3px; }
    .metric-value { font-size:28px; font-weight:800; font-family:'JetBrains Mono',monospace; color:var(--text); }
    .meta-fixa { font-size:12px; color:var(--text-muted); margin-top:4px; }

    .progress-bar { background:var(--glass-border); border-radius:20px; height:8px; margin-top:10px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg, var(--primary-light), var(--secondary)); width:0%; transition:width 0.6s ease; }

    .badge {
      display:inline-flex;
      padding:4px 14px;
      border-radius:40px;
      font-size:11px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.3px;
    }
    .badge-finl { background:#d4edda; color:#0f5c3f; }
    .badge-redi { background:#fff3cd; color:#856404; }
    .badge-veri { background:#cce5ff; color:#004085; }
    .badge-vite { background:#f8d7da; color:#721c24; }
    body.dark .badge-finl { background:#1a3c2c; color:#2bc48a; }
    body.dark .badge-redi { background:#3e2e1a; color:#f4b342; }
    body.dark .badge-veri { background:#1a3e44; color:#4dd0e1; }
    body.dark .badge-vite { background:#4a1a1a; color:#f05a5a; }

    .table-wrapper { overflow-x:auto; margin-top:8px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; padding:10px 8px; font-weight:600; color:var(--text-muted); border-bottom:2px solid var(--glass-border); }
    td { padding:10px 8px; border-bottom:1px solid var(--glass-border); }
    #monitoriasCard td { word-break:break-word; max-width:300px; }

    .filter-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .filter-bar input, .filter-bar select {
      padding:10px 16px;
      border-radius:40px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,0.4);
      backdrop-filter:blur(4px);
      color:var(--text);
      flex:1;
      min-width:140px;
      font-size:13px;
      transition:border 0.2s;
    }
    body.dark .filter-bar input, body.dark .filter-bar select {
      background:rgba(255,255,255,0.06);
    }
    .filter-bar input:focus, .filter-bar select:focus { outline:none; border-color:var(--primary-light); }
    .filter-bar .btn-clear-data { padding:4px 16px; font-size:12px; background:var(--primary); color:white; border:none; border-radius:40px; cursor:pointer; }
    .filter-bar .btn-clear-data:hover { background:var(--primary-dark); }
    #filtroDataDisplay { font-weight:600; font-size:13px; color:var(--text-muted); }

    .btn {
      background:var(--primary);
      border:none;
      padding:10px 22px;
      border-radius:40px;
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:background 0.2s, transform 0.1s, box-shadow 0.2s;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      text-decoration:none;
    }
    .btn:hover { background:var(--primary-dark); box-shadow:0 4px 12px rgba(0,87,160,0.3); }
    .btn:active { transform:scale(0.96); }
    .btn-sidebar { background:var(--glass-border); border:none; padding:8px 18px; border-radius:40px; font-weight:600; cursor:pointer; color:var(--text); transition:0.2s; }
    .btn-sidebar:hover { background:var(--primary-light); color:white; }
    .btn-logout { background:transparent; border:1px solid var(--glass-border); padding:8px 18px; border-radius:40px; font-weight:600; cursor:pointer; color:var(--text-muted); transition:0.2s; }
    .btn-logout:hover { background:#fee2e2; color:#b91c1c; border-color:#fecaca; }

    .top-bar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:20px;
      padding:10px 18px;
      background:var(--card-bg);
      backdrop-filter:blur(12px);
      border-radius:60px;
      border:1px solid var(--glass-border);
      box-shadow:var(--shadow);
    }
    .user-info { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .user-info strong { font-weight:600; }
    .theme-toggle { cursor:pointer; font-size:26px; background:transparent; border:none; color:var(--text); transition:0.2s; }

    .modal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(6px);
      align-items:center;
      justify-content:center;
      z-index:1000;
      padding:20px;
    }
    .modal-content {
      background:var(--card-bg);
      backdrop-filter:blur(16px);
      border-radius:32px;
      width:100%;
      max-width:700px;
      max-height:90vh;
      overflow-y:auto;
      padding:28px 32px;
      animation:fadeInUp 0.25s ease;
      border:1px solid var(--glass-border);
      box-shadow:0 20px 48px rgba(0,0,0,0.15);
      position:relative;
    }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .modal-content h2 { font-weight:700; margin-bottom:6px; color:var(--primary); }
    .modal-content .sub { color:var(--text-muted); font-size:14px; margin-bottom:20px; }
    .modal-close { background:transparent; border:none; font-size:24px; cursor:pointer; color:var(--text-muted); position:absolute; top:16px; right:20px; }

    .fab {
      position:fixed;
      bottom:24px;
      right:24px;
      width:56px;
      height:56px;
      border-radius:50%;
      background:var(--primary);
      border:none;
      color:white;
      font-size:24px;
      cursor:pointer;
      box-shadow:0 6px 20px rgba(0,87,160,0.3);
      transition:transform 0.3s, background 0.2s;
      z-index:99;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .fab:hover { background:var(--primary-dark); transform:scale(1.05); }
    .fab:active { transform:scale(0.9); }

    .nota-item {
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      border-bottom:1px solid var(--glass-border);
      font-size:12px;
      align-items:center;
      gap:8px;
    }
    .nota-item:last-child { border-bottom:none; }

    .ranking-item {
      display:flex;
      align-items:center;
      padding:8px 12px;
      margin:4px 0;
      border-radius:16px;
      background:var(--bg);
      border:1px solid var(--glass-border);
      cursor:pointer;
      transition:background 0.2s;
    }
    .ranking-item:hover { background:var(--primary-light); color:white; }
    .ranking-item .pos { font-weight:700; width:30px; }
    .ranking-item .stars { color:#f5b342; margin-left:8px; }
    .ranking-item .name { flex:1; font-weight:500; }
    .ranking-item .count { font-weight:600; font-family:'JetBrains Mono',monospace; }

    .link-item {
      display:flex;
      align-items:center;
      padding:12px 16px;
      margin:6px 0;
      border-radius:16px;
      background:var(--bg);
      border:1px solid var(--glass-border);
      transition:background 0.2s, transform 0.2s;
      text-decoration:none;
      color:var(--text);
    }
    .link-item:hover {
      background:var(--primary-light);
      color:white;
      transform:translateX(4px);
    }
    .link-item .link-icon { font-size:20px; margin-right:14px; }
    .link-item .link-name { flex:1; font-weight:500; }
    .link-item .link-url { font-size:12px; color:var(--text-muted); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .link-item:hover .link-url { color:rgba(255,255,255,0.8); }

    .hour-detail-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:16px;
    }
    .hour-detail-grid .list { max-height:300px; overflow-y:auto; }

    @media (max-width:860px) {
      .app-wrapper { flex-direction:column; }
      .sidebar-panel {
        position:fixed;
        top:0; left:0;
        width:100% !important;
        height:100vh;
        border-radius:0;
        z-index:999;
        transform:translateX(-100%);
        transition:transform 0.35s ease;
        box-shadow:0 0 40px rgba(0,0,0,0.2);
      }
      .sidebar-panel.open {
        transform:translateX(0);
        width:100% !important;
      }
      .top-bar { flex-direction:column; align-items:stretch; border-radius:24px; }
      .user-info { flex-wrap:wrap; }
      .metric-grid { grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); }
      .metric-value { font-size:24px; }
    }
    @media (max-width:480px) {
      body { padding:10px; }
      .login-container { margin:30px auto; padding:24px 16px; }
      .card { padding:16px; }
      .modal-content { padding:20px; }
      .hour-detail-grid { grid-template-columns:1fr; }
      .link-item .link-url { max-width:100%; }
      .top-bar { padding:10px; }
      .metric-grid { grid-template-columns:1fr 1fr; }
    }
    @media (orientation:landscape) and (max-height:500px) {
      .login-container { margin:20px auto; padding:20px; }
      .top-bar { padding:8px 14px; }
      .metric-grid { grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); }
      .metric-card { padding:10px; }
      .metric-value { font-size:20px; }
    }

    .supervisor-settings {
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--glass-border);
    }
    .supervisor-settings label {
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:500;
    }
    .supervisor-settings input {
      width:90px;
      padding:6px 10px;
      border-radius:30px;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,0.4);
      backdrop-filter:blur(4px);
      color:var(--text);
      font-weight:600;
      text-align:center;
    }
    body.dark .supervisor-settings input {
      background:rgba(255,255,255,0.06);
    }

    .clickable-date {
      cursor:pointer;
      color:var(--primary);
      text-decoration:underline dotted;
      font-weight:500;
    }
    .clickable-date:hover { color:var(--primary-dark); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginContainer" class="login-container">
  <h2>⚡ Neoenergia Brasília</h2>
  <p class="sub">Gestão de Produtividade + Monitorias</p>
  <div><input type="text" id="matricula" placeholder="Matrícula" autocomplete="off"></div>
  <div style="margin-top:12px;"><input type="password" id="senha" placeholder="Senha"></div>
  <button id="btnLogin" class="btn">Entrar</button>
  <div id="loginError" class="error-msg"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="app-wrapper">
    <!-- SIDEBAR -->
    <div class="sidebar-panel" id="sidebarPanel">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <h3>📊 Análise por Hora</h3>
          <button class="close-sidebar" id="closeSidebarBtn">✕</button>
        </div>
        <div style="margin-bottom:20px;"><canvas id="hourlyEvolutionChart" height="160"></canvas></div>
        <div><h4>⏱️ Notas da última hora</h4><div id="lastHourNotesList"></div></div>
        <div id="teamNotesSection" style="display:none; margin-top:16px;">
          <h4>📌 Últimas notas da equipe</h4>
          <input type="text" id="filtroMatricula" placeholder="Filtrar por nome ou matrícula" style="width:100%; margin-bottom:8px; padding:8px 14px; border-radius:40px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.4); backdrop-filter:blur(4px); color:var(--text);">
          <div id="teamNotesList"></div>
        </div>
      </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="dashboard-container">
      <div class="top-bar">
        <div class="user-info">
          <button id="openSidebarBtn" class="btn-sidebar">☰ Análise Hora</button>
          <button id="themeToggle" class="theme-toggle">☀️</button>
          <div><strong id="userName"></strong> <span id="userRoleBadge"></span></div>
          <button id="toggleSupervisorBtn" class="btn" style="display:none;">🔄 Modo Supervisor</button>
          <button id="searchIconBtn" style="background:transparent; border:none; font-size:24px; cursor:pointer; color:var(--text);">🔍</button>
        </div>
        <div class="flex" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <button id="linksUteisBtn" class="btn" style="background:#6c757d;">🔗 Links Úteis</button>
          <a href="https://wondrous-maamoul-c490d6.netlify.app/" target="_blank" class="btn" style="text-decoration:none;">✉️ Gerar resposta</a>
          <button id="logoutBtn" class="btn-logout">🚪 Sair</button>
        </div>
      </div>

      <!-- Métricas principais -->
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-label">📆 Feitas hoje</div>
          <div class="metric-value" id="feitasHoje">—</div>
          <div id="metaDiaHint" class="meta-fixa"></div>
        </div>
        <div class="metric-card"><div class="metric-label">📅 Feitas no mês</div><div class="metric-value" id="feitasMes">—</div></div>
        <div class="metric-card"><div class="metric-label">🏁 Faltam hoje</div><div class="metric-value" id="faltamHoje">—</div></div>
        <div class="metric-card"><div class="metric-label">📈 Média diária</div><div class="metric-value" id="mediaDiaria">—</div></div>
        <div class="metric-card"><div class="metric-label">🎯 Dias para meta</div><div class="metric-value" id="diasParaMeta">—</div></div>
        <div class="metric-card" id="ultimaHoraCard" style="border-left: 4px solid var(--primary); cursor:pointer;">
          <span class="expand-icon">⏬</span>
          <div class="metric-label">🕒 Notas última hora</div>
          <div class="metric-value" id="notasUltimaHoraMetrica">—</div>
        </div>
      </div>

      <!-- Métricas Cria vs Backlog -->
      <div class="metric-grid">
        <div class="metric-card"><div class="metric-label">✅ FINALIZADAS Cria (hoje)</div><div class="metric-value" id="finalizadasCriaHoje">—</div></div>
        <div class="metric
